# One command: docker compose up --build
# App: http://localhost:3000   API: http://localhost:4000/api/health
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: svm
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d svm']
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_ADMIN_URL: postgres://postgres:postgres@db:5432/svm
      DATABASE_URL: postgres://svm_app:app-secret@db:5432/svm
      APP_DB_PASSWORD: app-secret
      PORT: 4000
      # Set to EMAIL, SMS or EMAIL,SMS to see the notification-failure path.
      SIMULATE_CHANNEL_FAILURES: ''
    ports:
      - '4000:4000'

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:4000
    depends_on:
      - backend
    ports:
      - '3000:3000'

volumes:
  dbdata:
